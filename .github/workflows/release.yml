name: Release Ventoy Seed Images

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools

      - name: Build images
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh
          cp configs/ventoy.json build/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/base.img
            build/docker.img
            build/ventoy.json
