name: Build Ventoy Seed Images

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools cloud-init

      - name: Validate cloud-init configs
        run: |
          for variant in base docker; do
            echo "Validating ubuntu-$variant/user-data..."
            cloud-init schema --config-file "configs/ubuntu-$variant/user-data" || true
          done

      - name: Build images
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh

      - name: Prepare Artifacts
        run: |
          cp configs/ventoy.json build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ventoy-autoinstall-artifacts
          path: build/
          retention-days: 7
